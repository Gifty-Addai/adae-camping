<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <!-- Jar Glass Body -->
  <defs>
    <linearGradient id="tallowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0dc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ddb5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Jar body glass -->
  <path d="M 120 200 L 120 480 Q 120 520 140 530 L 260 530 Q 280 520 280 480 L 280 200 Q 280 180 260 180 L 140 180 Q 120 180 120 200 Z" 
        fill="none" stroke="#b0b0b0" stroke-width="2" opacity="0.6"/>
  
  <!-- Tallow content -->
  <path d="M 125 240 L 125 475 Q 125 515 145 525 L 255 525 Q 275 515 275 475 L 275 240 Z" 
        fill="url(#tallowGradient)"/>
  
  <!-- Glass reflection -->
  <path d="M 135 200 L 135 480 Q 135 510 150 520" 
        fill="none" stroke="url(#glassShine)" stroke-width="20" opacity="0.5"/>
  
  <!-- Black Label -->
  <rect x="140" y="300" width="120" height="160" rx="8" fill="#1a1a1a"/>
  
  <!-- Cow Icon -->
  <g transform="translate(200, 330)">
    <path d="M -15 -8 Q -20 -12 -18 -16 Q -16 -18 -14 -16 Q -12 -18 -10 -16 L -8 -10 L -2 -10 L 0 -16 Q 2 -18 4 -16 Q 6 -18 8 -16 Q 10 -12 5 -8 L 8 0 Q 8 8 4 12 L -4 12 Q -8 8 -8 0 Z M -4 2 Q -6 2 -6 4 Q -6 6 -4 6 Q -2 6 -2 4 Q -2 2 -4 2 Z M 4 2 Q 2 2 2 4 Q 2 6 4 6 Q 6 6 6 4 Q 6 2 4 2 Z" 
          fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
  </g>
  
  <!-- Label Text -->
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">BEEF</text>
  <text x="200" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">TALLOW</text>
  <text x="200" y="450" font-family="Arial, sans-serif" font-size="10" fill="#999999" text-anchor="middle">ANCESTRAL</text>
  
  <!-- Black Lid -->
  <ellipse cx="200" cy="175" rx="65" ry="12" fill="#1a1a1a"/>
  <rect x="135" y="165" width="130" height="20" fill="#1a1a1a"/>
  <ellipse cx="200" cy="165" rx="65" ry="12" fill="#2a2a2a"/>
  <ellipse cx="200" cy="165" rx="60" ry="10" fill="#1a1a1a"/>
  
  <!-- Lid highlight -->
  <ellipse cx="200" cy="165" rx="50" ry="7" fill="#3a3a3a" opacity="0.6"/>
</svg>
